<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style id="set-completion-state-v3">
/* Set completion: NEVER green until the user completes the set. */
#routine .setrow .setdone{
  background:#e5e5ea!important;
  color:#6c6c70!important;
  border:2px solid #8e8e93!important;
  border-radius:11px!important;
  font-size:0!important;
  font-weight:800!important;
  cursor:pointer!important;
  opacity:1!important;
  box-shadow:none!important;
}
#routine .setrow .setdone::after{content:'✓';font-size:20px!important;color:transparent!important}
#routine .setrow .setdone[data-saved="1"]{
  background:#34c759!important;
  border-color:#34c759!important;
  color:#fff!important;
}
#routine .setrow .setdone[data-saved="1"]::after{color:#fff!important}
#routine .setrow.completed{background:#dff7e5!important}
</style>
