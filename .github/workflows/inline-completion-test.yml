name: Inline completion test
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch inline completion
        shell: python
        run: |
          from pathlib import Path
          p = Path('sw.js')
          s = p.read_text()
          if 'completion-inline-v1' in s:
              print('already patched')
              raise SystemExit(0)
          s = s.replace("const CACHE='my-workout-pwa-v29';", "const CACHE='my-workout-pwa-v30';", 1)
          css = r'''\n/* completion-inline-v1: completion check stays inline with each set */\n#routine .setrow{display:grid!important;grid-template-columns:36px minmax(0,1fr) minmax(0,1fr) 42px!important;align-items:center!important;gap:6px!important;width:100%!important;min-width:0!important;padding:6px 4px!important}\n#routine .setrow>*{min-width:0!important;max-width:100%!important}\n#routine .setrow .setdone{grid-column:4!important;grid-row:1!important;justify-self:end!important;width:42px!important;min-width:42px!important;height:42px!important;min-height:42px!important;margin:0!important}\n#routine .setrow>input:nth-of-type(1){grid-column:2!important;grid-row:1!important;width:100%!important}\n#routine .setrow>input:nth-of-type(2){grid-column:3!important;grid-row:1!important;width:100%!important}\n#routine .setrow>span:first-child,#routine .setrow>label:first-child{grid-column:1!important;grid-row:1!important}\n@media(max-width:380px){#routine .setrow{grid-template-columns:34px minmax(0,1fr) minmax(0,1fr) 40px!important;gap:5px!important}#routine .setrow .setdone{width:40px!important;min-width:40px!important;height:40px!important;min-height:40px!important}}\n'''
          s = s.replace('</style>`;', css + '</style>`;', 1)
          p.write_text(s)
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sw.js
          git diff --cached --quiet && exit 0
          git commit -m "Keep workout completion check inline"
          git push
