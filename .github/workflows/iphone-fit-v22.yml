name: Apply final iPhone width fix
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/iphone-fit-v22.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch index.html
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          css='''\n<style id="iphone-fit-v22">\nhtml,body{width:100%!important;max-width:100%!important;overflow-x:hidden!important}\nbody{min-width:0!important}\n@media (max-width:900px),(pointer:coarse){\n  .top{width:100%!important;max-width:100%!important;overflow:hidden!important}\n  .wrap{width:100%!important;max-width:100%!important;margin:0!important;padding:10px!important;overflow:hidden!important}\n  .grid{display:block!important;width:100%!important;max-width:100%!important;min-width:0!important}\n  .grid>aside{display:none!important}\n  main{display:block!important;width:100%!important;max-width:100%!important;min-width:0!important;overflow:hidden!important}\n  .tabs{display:grid!important;grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:8px!important;width:100%!important}\n  .tabs .tab{width:100%!important;min-width:0!important;max-width:100%!important;overflow:hidden!important;white-space:normal!important;padding:12px 6px!important}\n  .card{width:100%!important;max-width:100%!important;min-width:0!important;overflow:hidden!important;padding:14px!important}\n  .toolbar{width:100%!important;max-width:100%!important;min-width:0!important}\n  .workout-nav{display:grid!important;grid-template-columns:minmax(0,1fr)!important;gap:10px!important}\n  .workout-nav label{width:100%!important;min-width:0!important;max-width:100%!important;display:grid!important;grid-template-columns:1fr!important;gap:6px!important;align-items:stretch!important}\n  .workout-nav label select,.workout-nav input{width:100%!important;max-width:100%!important;min-width:0!important}\n  #routine{width:100%!important;max-width:100%!important;min-width:0!important;overflow:hidden!important}\n  #routine h1,#routine h2,#routine h3,#routine p{max-width:100%!important;overflow-wrap:anywhere!important;word-break:normal!important}\n  .setrow{display:grid!important;grid-template-columns:48px minmax(0,1fr) minmax(0,1fr)!important;gap:7px!important;width:100%!important;max-width:100%!important;min-width:0!important;padding:8px!important}\n  .setrow>*{min-width:0!important;max-width:100%!important}\n  .setrow input{width:100%!important;min-width:0!important;max-width:100%!important;padding:10px 8px!important}\n  .setdone{grid-column:2 / -1!important;width:100%!important;min-width:0!important}\n  .setrow.completed{width:100%!important}\n  .section{max-width:100%!important;overflow-wrap:anywhere!important}\n  .metricgrid{grid-template-columns:repeat(2,minmax(0,1fr))!important;width:100%!important}\n  .builder-row{grid-template-columns:minmax(0,1fr) 58px 78px!important;width:100%!important}\n  .builder-row select,.builder-row input{min-width:0!important;width:100%!important}\n  .exercise-item{min-width:0!important;max-width:100%!important;overflow:hidden!important}\n  .exercise-item>*{min-width:0!important;max-width:100%!important}\n}\n@media (max-width:430px){\n  .top{padding:12px!important}\n  .wrap{padding:8px!important}\n  .card{padding:12px!important;border-radius:12px!important}\n  .tabs{gap:6px!important}\n  .tabs .tab{font-size:16px!important;padding:11px 4px!important}\n  .setrow{grid-template-columns:44px minmax(0,1fr) minmax(0,1fr)!important;gap:6px!important}\n  .setrow input{font-size:16px!important}\n}\n</style>\n'''
          if 'id="iphone-fit-v22"' not in s:
              s=s.replace('</head>',css+'</head>',1)
              p.write_text(s)
          PY
      - name: Commit patched index
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Fix iPhone viewport overflow and set rows'
          git push
