name: Patch workout navigation

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Inject navigation script
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          marker = '<script id="category-navigation-loader" src="./category-navigation.js?v=2"></script>'
          if marker not in text:
              needle = '</body>'
              if needle not in text:
                  raise SystemExit('Could not find </body> in index.html')
              text = text.replace(needle, marker + '\n' + needle, 1)
              p.write_text(text, encoding='utf-8')
              print('Navigation script injected.')
          else:
              print('Navigation script already present.')
          PY

      - name: Restore workout summary to reference screenshot
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker='workout-summary-reference-v1'
          if marker not in s:
              pattern=re.compile(r'html\+=`<div class="card" style="padding:11px;margin:8px 0"><div class="workout-summary-source-v1">.*?</div>\n      <div class="setrows">', re.S)
              replacement='''html+=`<div class="card" style="padding:11px;margin:8px 0"><div class="workout-summary-reference-v1"><div class="workout-reference-name"><strong>${esc(e.exercise)}</strong></div><div class="workout-reference-stats"><div><span class="muted">Sets</span><strong>${esc(e.sets||'1')}</strong></div><div><span class="muted">Reps</span><strong>${esc(e.reps)}</strong></div></div><div class="workout-reference-equipment"><select id="eq_${id}"><option>Barbell</option><option>Dumbbells</option><option>Bodyweight</option><option>Cable/Machine</option><option>Kettlebell</option><option>Other</option></select></div></div>
      <div class="setrows">'''
              s2,n=pattern.subn(replacement,s,count=1)
              if n!=1:
                  raise SystemExit(f'Workout summary source not found; matches={n}')
              s=s2
              css='''\n<style id="workout-summary-reference-v1-css">\n#routine .workout-summary-reference-v1{width:100%!important;min-width:0!important}\n#routine .workout-reference-name{width:100%!important;margin:0 0 24px!important}\n#routine .workout-reference-name strong{display:block!important;color:#1c1c1e!important;font-size:17px!important;line-height:1.2!important;font-weight:700!important;overflow-wrap:anywhere!important}\n#routine .workout-reference-stats{display:block!important;width:100%!important}\n#routine .workout-reference-stats>div{display:block!important;margin:0 0 24px!important}\n#routine .workout-reference-stats .muted{display:block!important;color:#6c6c70!important;font-size:14px!important;line-height:1.2!important;margin:0 0 8px!important}\n#routine .workout-reference-stats strong{display:block!important;color:#1c1c1e!important;font-size:17px!important;line-height:1.2!important;font-weight:500!important}\n#routine .workout-reference-equipment{width:100%!important;margin-top:0!important}\n#routine .workout-reference-equipment select{display:block!important;width:100%!important;min-width:0!important;max-width:100%!important;min-height:42px!important;padding:7px 10px!important;border:1px solid #c7c7cc!important;border-radius:11px!important;background:#f2f2f7!important;color:#1c1c1e!important;font-size:16px!important}\n</style>\n'''
              s=s.replace('</head>',css+'</head>',1)
              p.write_text(s,encoding='utf-8')
              print('Workout summary restored to reference layout.')
          else:
              print('Workout summary reference layout already present.')
          PY

      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'Restore workout summary to reference screenshot'
          git push
