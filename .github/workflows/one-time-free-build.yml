name: Apply free-build UI directly to index

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'Fix workout exercise summary row layout') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch workout summary row
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          old = '''html+=`<div class="card" style="padding:11px;margin:8px 0"><div style="display:grid;grid-template-columns:minmax(180px,1fr) 65px 150px 140px;gap:8px;align-items:center">
      <strong>${esc(e.exercise)}</strong><div><span class="muted">Sets</span><br>${esc(e.sets||'1')}</div><div><span class="muted">Reps</span><br>${esc(e.reps)}</div>
      <select id="eq_${id}"><option>Barbell</option><option>Dumbbells</option><option>Bodyweight</option><option>Cable/Machine</option><option>Kettlebell</option><option>Other</option></select></div>
      <div class="setrows">'''
          new = '''html+=`<div class="card workout-exercise-card" style="padding:11px;margin:8px 0"><div class="workout-plan-row">
      <div class="workout-plan-exercise"><span class="workout-plan-label">Exercise</span><strong>${esc(e.exercise)}</strong></div><div class="workout-plan-cell"><span class="workout-plan-label">Sets</span><strong>${esc(e.sets||'1')}</strong></div><div class="workout-plan-cell"><span class="workout-plan-label">Reps</span><strong>${esc(e.reps)}</strong></div>
      <div class="workout-plan-cell workout-plan-equipment"><span class="workout-plan-label">Equipment</span><select id="eq_${id}"><option>Barbell</option><option>Dumbbells</option><option>Bodyweight</option><option>Cable/Machine</option><option>Kettlebell</option><option>Other</option></select></div></div>
      <div class="setrows">'''
          if old not in s:
              raise SystemExit('Target workout summary markup not found')
          s = s.replace(old, new, 1)
          css = '''<style id="workout-summary-row-v6">
          .workout-plan-row{display:grid;grid-template-columns:minmax(0,1fr) 58px 58px 118px;gap:8px;align-items:center;width:100%;min-width:0}
          .workout-plan-exercise,.workout-plan-cell{min-width:0}
          .workout-plan-label{display:block;color:#6c6c70;font-size:12px;font-weight:600;line-height:1.15;margin-bottom:3px}
          .workout-plan-exercise>strong{display:block;color:#1c1c1e;font-size:17px;line-height:1.2;overflow-wrap:anywhere}
          .workout-plan-cell>strong{display:block;color:#1c1c1e;font-size:17px;line-height:1.2}
          .workout-plan-equipment select{width:100%!important;min-width:0!important;max-width:100%!important;min-height:42px!important;padding:8px 7px!important;border:1px solid #c7c7cc!important;border-radius:11px!important;background:#f2f2f7!important;color:#1c1c1e!important;font-size:15px!important}
          @media(max-width:600px),(pointer:coarse){
            .workout-plan-row{grid-template-columns:minmax(0,1fr) 42px 48px 82px;gap:4px}
            .workout-plan-label{font-size:11px;margin-bottom:3px}
            .workout-plan-exercise>strong{font-size:16px}
            .workout-plan-cell>strong{font-size:16px;text-align:center}
            .workout-plan-equipment select{min-height:40px!important;padding:7px 4px!important;font-size:13px!important}
          }
          @media(max-width:380px){
            .workout-plan-row{grid-template-columns:minmax(0,1fr) 40px 46px 76px;gap:3px}
            .workout-plan-exercise>strong{font-size:15px}
            .workout-plan-cell>strong{font-size:15px}
            .workout-plan-equipment select{font-size:12px!important;padding-left:3px!important;padding-right:3px!important}
          }
          </style>
          '''
          if 'id="workout-summary-row-v6"' not in s:
              s = s.replace('</head>', css + '</head>', 1)
          p.write_text(s)
          PY
      - name: Commit patched index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Fix workout exercise summary row layout"
          git push
