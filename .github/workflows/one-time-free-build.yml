name: Apply free-build UI directly to index

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'Restore exact workout exercise summary') && !contains(github.event.head_commit.message, 'Make workout summary restore exact') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore exact workout summary
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='''html+=`<div class="card" style="padding:11px;margin:8px 0"><div class="workout-exercise-labels"><span>Exercise</span><span>Sets</span><span>Reps</span><span>Equipment</span></div><div style="display:grid;grid-template-columns:minmax(180px,1fr) 65px 150px 140px;gap:8px;align-items:center">
      <strong>${esc(e.exercise)}</strong><div>${esc(e.sets||'1')}</div><div>${esc(e.reps)}</div>
      <select id="eq_${id}"><option>Barbell</option><option>Dumbbells</option><option>Bodyweight</option><option>Cable/Machine</option><option>Kettlebell</option><option>Other</option></select></div>'''
          new='''html+=`<div class="card" style="padding:11px;margin:8px 0"><div class="workout-exercise-summary"><div class="workout-exercise-name"><strong>${esc(e.exercise)}</strong></div><div class="workout-exercise-details"><span class="workout-pair"><span class="workout-label">Sets</span> <strong>${esc(e.sets||'1')}</strong></span><span class="workout-pair"><span class="workout-label">Reps</span> <strong>${esc(e.reps)}</strong></span><span class="workout-pair workout-equipment"><span class="workout-label">Equipment</span> <select id="eq_${id}"><option>Barbell</option><option>Dumbbells</option><option>Bodyweight</option><option>Cable/Machine</option><option>Kettlebell</option><option>Other</option></select></span></div>'''
          if old not in s:
              raise SystemExit('Target workout summary template not found')
          s=s.replace(old,new,1)
          marker='<style id="workout-summary-exact-v1">'
          if marker not in s:
              css='''<style id="workout-summary-exact-v1">
          #routine .workout-exercise-summary{width:100%!important;min-width:0!important}
          #routine .workout-exercise-name{width:100%!important;min-width:0!important;margin:0 0 7px!important}
          #routine .workout-exercise-name strong{display:block!important;color:#1c1c1e!important;font-size:17px!important;line-height:1.2!important;font-weight:700!important;overflow-wrap:anywhere!important}
          #routine .workout-exercise-details{display:flex!important;align-items:center!important;gap:14px!important;width:100%!important;min-width:0!important}
          #routine .workout-pair{display:inline-flex!important;align-items:center!important;gap:4px!important;white-space:nowrap!important;min-width:0!important}
          #routine .workout-label{color:#6c6c70!important;font-size:12px!important;font-weight:600!important;line-height:1.2!important}
          #routine .workout-pair>strong{color:#1c1c1e!important;font-size:16px!important;line-height:1.2!important;font-weight:600!important}
          #routine .workout-equipment{flex:1 1 auto!important;min-width:0!important}
          #routine .workout-equipment select{width:auto!important;min-width:76px!important;max-width:100%!important;min-height:38px!important;padding:6px 7px!important;border:1px solid #c7c7cc!important;border-radius:10px!important;background:#f2f2f7!important;color:#1c1c1e!important;font-size:14px!important}
          @media(max-width:560px),(pointer:coarse){
            #routine .workout-exercise-name{margin-bottom:6px!important}
            #routine .workout-exercise-name strong{font-size:16px!important}
            #routine .workout-exercise-details{gap:9px!important;overflow:hidden!important}
            #routine .workout-pair{gap:3px!important}
            #routine .workout-label{font-size:11px!important}
            #routine .workout-pair>strong{font-size:15px!important}
            #routine .workout-equipment{flex:1 1 auto!important}
            #routine .workout-equipment select{min-width:72px!important;min-height:38px!important;font-size:13px!important;padding:6px 5px!important}
          }
          @media(max-width:380px){
            #routine .workout-exercise-details{gap:6px!important}
            #routine .workout-label{font-size:10px!important}
            #routine .workout-pair>strong{font-size:14px!important}
            #routine .workout-equipment select{min-width:66px!important;font-size:12px!important}
          }
          </style>\n'''
              s=s.replace('</head>',css+'</head>',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit patched index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Restore exact workout exercise summary"
          git pull --rebase origin main
          git push origin HEAD:main
