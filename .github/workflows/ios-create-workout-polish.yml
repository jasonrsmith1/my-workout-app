name: Polish Create Workout iOS

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply iOS Create Workout styling
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = '<style id="ios-create-workout-v2">'
          if marker in s:
              print('Create Workout iOS polish already present')
              raise SystemExit(0)
          css = r'''
          <style id="ios-create-workout-v2">
          /* Create Workout — calm, premium iOS hierarchy */
          #builderTab .card{background:rgba(255,255,255,.96)!important;border:1px solid rgba(60,60,67,.12)!important;border-radius:22px!important;padding:22px!important;box-shadow:0 10px 30px rgba(0,0,0,.055)!important}
          #builderTab h2{margin:0!important;font-size:28px!important;line-height:1.12!important;letter-spacing:-.7px!important;font-weight:750!important;color:#1c1c1e!important}
          #builderTab .card>p.muted{margin:7px 0 20px!important;color:#6c6c70!important;font-size:15px!important;line-height:1.45!important}
          #muscleChoices{display:grid!important;grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:10px!important;margin:0 0 18px!important}
          #muscleChoices label{position:relative!important;display:flex!important;align-items:center!important;gap:10px!important;min-height:50px!important;padding:12px 13px!important;border:1px solid #d1d1d6!important;border-radius:14px!important;background:#f9f9fb!important;color:#1c1c1e!important;font-weight:600!important;font-size:15px!important;box-shadow:inset 0 1px 0 rgba(255,255,255,.8)!important;transition:background .15s ease,border-color .15s ease,transform .15s ease!important}
          #muscleChoices label:has(input:checked){background:#eaf3ff!important;border-color:#007aff!important;color:#0062cc!important}
          #muscleChoices input{width:20px!important;height:20px!important;accent-color:#007aff!important;flex:0 0 auto!important}
          #builderTab .toolbar{align-items:center!important;gap:10px!important;margin:0 0 12px!important;padding:12px!important;background:#f2f2f7!important;border:1px solid #e5e5ea!important;border-radius:15px!important}
          #builderTab .toolbar label{display:flex!important;align-items:center!important;gap:9px!important;color:#6c6c70!important;font-size:14px!important;font-weight:600!important}
          #builderTab .toolbar select,#builderTab .toolbar input{min-height:44px!important;padding:10px 12px!important;border:1px solid #c7c7cc!important;border-radius:12px!important;background:#fff!important;color:#1c1c1e!important;font-size:16px!important;outline:none!important;box-shadow:0 1px 2px rgba(0,0,0,.03)!important}
          #builderTab .toolbar select:focus,#builderTab .toolbar input:focus{border-color:#007aff!important;box-shadow:0 0 0 3px rgba(0,122,255,.14)!important}
          #builderTab .toolbar .log,#builderTab .card>div>.log,#builderTab button.log{min-height:44px!important;border:0!important;border-radius:12px!important;padding:10px 16px!important;background:#007aff!important;color:#fff!important;font-weight:700!important;box-shadow:0 2px 6px rgba(0,122,255,.22)!important}
          #builderTab .toolbar .tab,#builderTab button.tab{min-height:44px!important;border:1px solid #c7c7cc!important;border-radius:12px!important;padding:10px 15px!important;background:#fff!important;color:#1c1c1e!important;font-weight:650!important}
          #builderTab .toolbar:nth-of-type(2){background:transparent!important;border:0!important;padding:0!important;margin-top:4px!important}
          #builderTab #builder{margin-top:20px!important;padding-top:4px!important}
          #builderTab #builder h3{margin:0 0 5px!important;font-size:21px!important;letter-spacing:-.3px!important;color:#1c1c1e!important}
          #builderTab #builder>p.muted{margin:0 0 12px!important;color:#6c6c70!important}
          #builderTab .builder-row{display:grid!important;grid-template-columns:minmax(0,1fr) 68px 86px 118px!important;gap:9px!important;align-items:center!important;padding:12px 0!important;border-bottom:1px solid #e5e5ea!important}
          #builderTab .builder-row>div:first-child b{display:block!important;font-size:15px!important;line-height:1.25!important;color:#1c1c1e!important}
          #builderTab .builder-row .muted{margin-top:3px!important;color:#8e8e93!important;font-size:12px!important}
          #builderTab .builder-row input,#builderTab .builder-row select{min-height:42px!important;padding:8px 9px!important;border:1px solid #c7c7cc!important;border-radius:11px!important;background:#f9f9fb!important;color:#1c1c1e!important;font-size:16px!important}
          #builderTab .builder-row input:focus,#builderTab .builder-row select:focus{outline:none!important;border-color:#007aff!important;box-shadow:0 0 0 3px rgba(0,122,255,.13)!important;background:#fff!important}
          #builderTab #builder>div:last-child{margin-top:18px!important;padding-top:4px!important}
          #builderTab #builder>div:last-child .log{width:100%!important;min-height:50px!important;border-radius:15px!important;background:#007aff!important;font-size:16px!important;font-weight:750!important;box-shadow:0 3px 9px rgba(0,122,255,.22)!important}
          @media(max-width:600px),(pointer:coarse){#builderTab .card{padding:18px!important;border-radius:20px!important}#builderTab h2{font-size:27px!important}#muscleChoices{grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:8px!important}#muscleChoices label{min-height:48px!important;padding:10px!important;font-size:14px!important}#builderTab .toolbar{padding:10px!important;border-radius:14px!important}#builderTab .toolbar label{width:auto!important;flex:1 1 auto!important}#builderTab .toolbar select{width:100%!important}#builderTab .toolbar .log,#builderTab .toolbar .tab{width:100%!important}#builderTab .toolbar:nth-of-type(2){display:grid!important;grid-template-columns:1fr!important;gap:8px!important}#builderTab .builder-row{grid-template-columns:minmax(0,1fr) 58px 78px!important;gap:7px!important;padding:11px 0!important}#builderTab .builder-row>div:first-child{grid-column:1/-1!important}#builderTab .builder-row select{grid-column:2/-1!important}#builderTab #builder>div:last-child .log{min-height:52px!important}}
          @media(max-width:380px){#builderTab .card{padding:15px!important}#muscleChoices{gap:7px!important}#muscleChoices label{font-size:13px!important}}
          </style>
          '''
          s = s.replace('</head>', css + '\n</head>', 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Polish Create Workout for iOS"
          git push
