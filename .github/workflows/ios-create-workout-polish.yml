name: Polish Create Workout iOS

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply iOS workout and Create Workout layout
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = '<style id="ios-workout-summary-v5">'
          if marker in s:
              print('iOS workout summary v5 already present')
              raise SystemExit(0)
          css = r'''
          <style id="ios-workout-summary-v5">
          /* Workout exercise summary: Exercise | Sets | Reps | Equipment */
          .ios-workout-plan{width:100%;min-width:0;margin:0 0 10px;padding:0}
          .ios-workout-plan-head,.ios-workout-plan-values{display:grid;grid-template-columns:minmax(0,1fr) 52px 52px 108px;gap:8px;align-items:center;width:100%;min-width:0}
          .ios-workout-plan-head{padding:0 4px 5px;color:#6c6c70;font-size:12px;font-weight:600;letter-spacing:.1px}
          .ios-workout-plan-values{padding:10px 10px;background:#f2f2f7;border:1px solid rgba(60,60,67,.10);border-radius:13px}
          .ios-workout-plan-values>strong{font-size:16px;line-height:1.2;color:#1c1c1e;overflow-wrap:anywhere}
          .ios-workout-plan-values>span{font-size:17px;font-weight:600;color:#1c1c1e;text-align:center}
          .ios-workout-plan-values>select{width:100%!important;min-width:0!important;max-width:100%!important;min-height:42px!important;padding:8px 7px!important;border:1px solid #c7c7cc!important;border-radius:11px!important;background:#fff!important;color:#1c1c1e!important;font-size:15px!important}
          .ios-workout-plan-head>span:nth-child(n+2){text-align:center}
          .exercise-group>h3.ios-hidden-workout-title{display:none!important}
          .exercise-group>.ios-hidden-workout-summary{display:none!important}
          @media(max-width:600px),(pointer:coarse){
            .ios-workout-plan{margin-bottom:9px}
            .ios-workout-plan-head,.ios-workout-plan-values{grid-template-columns:minmax(0,1fr) 42px 50px 82px;gap:4px}
            .ios-workout-plan-head{font-size:11px;padding:0 2px 4px}
            .ios-workout-plan-values{padding:9px 7px;border-radius:12px}
            .ios-workout-plan-values>strong{font-size:15px}
            .ios-workout-plan-values>span{font-size:16px}
            .ios-workout-plan-values>select{min-height:40px!important;padding:7px 4px!important;font-size:14px!important}
          }
          @media(max-width:380px){
            .ios-workout-plan-head,.ios-workout-plan-values{grid-template-columns:minmax(0,1fr) 40px 48px 76px;gap:3px}
            .ios-workout-plan-values>strong{font-size:14px}
            .ios-workout-plan-values>select{font-size:13px!important;padding-left:3px!important;padding-right:3px!important}
          }
          /* Create Workout builder stays horizontal and readable */
          #builderTab .builder-row{display:grid!important;grid-template-columns:minmax(0,1fr) 68px 82px 118px!important;gap:7px!important;align-items:center!important;width:100%!important;min-width:0!important}
          #builderTab .builder-row>div:first-child{grid-column:1!important;min-width:0!important}
          #builderTab .builder-row>input:nth-child(2){grid-column:2!important}
          #builderTab .builder-row>input:nth-child(3){grid-column:3!important}
          #builderTab .builder-row>select:nth-child(4){grid-column:4!important}
          #builderTab .builder-row>div:first-child b{font-size:15px!important;line-height:1.2!important;overflow-wrap:anywhere!important}
          @media(max-width:600px),(pointer:coarse){
            #builderTab .builder-row{grid-template-columns:minmax(0,1fr) 48px 56px 82px!important;gap:4px!important;padding:8px 0!important}
            #builderTab .builder-row input,#builderTab .builder-row select{min-height:40px!important;padding:7px 4px!important;font-size:14px!important}
            #builderTab .builder-row>div:first-child b{font-size:15px!important}
          }
          @media(max-width:380px){
            #builderTab .builder-row{grid-template-columns:minmax(0,1fr) 45px 53px 76px!important;gap:3px!important}
          }
          </style>
          <script id="ios-workout-summary-v5-js">
          (function(){
            function textValue(el){
              return el ? el.textContent.replace(/\\s+/g,' ').trim() : '';
            }
            function numberAfter(label, text){
              var m=text.match(new RegExp(label+'\\s*:?[\\s\\u00a0]*(\\d+(?:\\.\\d+)?)','i'));
              return m ? m[1] : '';
            }
            function transform(){
              document.querySelectorAll('#routine .exercise-group').forEach(function(group){
                if(group.querySelector(':scope > .ios-workout-plan')) return;
                var title=group.querySelector(':scope > h3');
                if(!title) return;
                var select=group.querySelector(':scope select:not(.setrow select)');
                var candidates=[];
                Array.from(group.children).forEach(function(el){
                  if(el===title || el.classList.contains('setrows')) return;
                  var t=textValue(el);
                  if(t && (/(?:^|\\s)Sets\\s*\\d+/i.test(t)||/(?:^|\\s)Reps\\s*\\d+/i.test(t)||el.querySelector('select'))) candidates.push(el);
                });
                var summary=candidates[0] || null;
                if(!summary) return;
                var raw=textValue(summary);
                var sets=numberAfter('Sets',raw), reps=numberAfter('Reps',raw);
                if(!sets){var sm=raw.match(/\\b(\\d+)\\b/); if(sm) sets=sm[1]}
                if(!reps){var rm=raw.match(/Reps\\D*(\\d+)/i); if(rm) reps=rm[1]}
                var plan=document.createElement('div');
                plan.className='ios-workout-plan';
                plan.innerHTML='<div class="ios-workout-plan-head"><span>Exercise</span><span>Sets</span><span>Reps</span><span>Equipment</span></div><div class="ios-workout-plan-values"><strong></strong><span class="ios-plan-sets"></span><span class="ios-plan-reps"></span><span class="ios-plan-equipment"></span></div>';
                plan.querySelector('strong').textContent=textValue(title);
                plan.querySelector('.ios-plan-sets').textContent=sets || '—';
                plan.querySelector('.ios-plan-reps').textContent=reps || '—';
                var eq=plan.querySelector('.ios-plan-equipment');
                if(select){
                  eq.appendChild(select);
                }else{
                  eq.textContent='—';
                }
                title.classList.add('ios-hidden-workout-title');
                summary.classList.add('ios-hidden-workout-summary');
                title.parentNode.insertBefore(plan, title);
              });
            }
            function schedule(){ setTimeout(transform,60); setTimeout(transform,300); }
            document.addEventListener('click',function(e){
              if(e.target.closest('.tabs .tab') || e.target.closest('.workout-nav')) schedule();
            },true);
            document.addEventListener('change',function(e){
              if(e.target.closest('.workout-nav') || e.target.closest('#routine')) schedule();
            },true);
            if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',schedule); else schedule();
          })();
          </script>
          '''
          s = s.replace('</head>', css + '\n</head>', 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Align workout exercise summary on iPhone"
          git push
