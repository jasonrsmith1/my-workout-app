name: Polish Create Workout iOS

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply final iOS Create Workout layout
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = '<style id="ios-create-workout-v4">'
          if marker in s:
              print('Create Workout iOS v4 already present')
              raise SystemExit(0)
          css = r'''
          <style id="ios-create-workout-v4">
          /* Final Create Workout iPhone layout: Exercise | Sets | Reps | Equipment */
          #builderTab .card{background:#fff!important;border:1px solid rgba(60,60,67,.12)!important;border-radius:22px!important;box-shadow:0 8px 28px rgba(0,0,0,.05)!important}
          #builderTab .builder-row{display:grid!important;grid-template-columns:minmax(0,1fr) 68px 82px 118px!important;gap:7px!important;align-items:center!important;width:100%!important;min-width:0!important}
          #builderTab .builder-row>div:first-child{grid-column:1!important;min-width:0!important}
          #builderTab .builder-row>input:nth-child(2){grid-column:2!important}
          #builderTab .builder-row>input:nth-child(3){grid-column:3!important}
          #builderTab .builder-row>select:nth-child(4){grid-column:4!important}
          #builderTab .builder-row input,#builderTab .builder-row select{width:100%!important;min-width:0!important;max-width:100%!important;min-height:42px!important;padding:8px 7px!important;border:1px solid #c7c7cc!important;border-radius:11px!important;background:#f9f9fb!important;color:#1c1c1e!important;font-size:16px!important}
          #builderTab .builder-row>div:first-child b{font-size:14px!important;line-height:1.2!important;overflow-wrap:anywhere!important}
          #builderTab .builder-row .muted{font-size:11px!important;color:#8e8e93!important;white-space:nowrap!important;overflow:hidden!important;text-overflow:ellipsis!important}
          @media(max-width:600px),(pointer:coarse){
            #builderTab .card{padding:15px!important;border-radius:20px!important}
            #builderTab h2{font-size:26px!important}
            #muscleChoices{grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:7px!important}
            #muscleChoices label{min-height:44px!important;padding:8px!important;font-size:14px!important}
            #builderTab .builder-row{grid-template-columns:minmax(0,1fr) 48px 56px 82px!important;gap:4px!important;padding:8px 0!important}
            #builderTab .builder-row>input:nth-child(2){grid-column:2!important}
            #builderTab .builder-row>input:nth-child(3){grid-column:3!important}
            #builderTab .builder-row>select:nth-child(4){grid-column:4!important}
            #builderTab .builder-row input,#builderTab .builder-row select{min-height:40px!important;padding:7px 4px!important;font-size:14px!important}
            #builderTab .builder-row>div:first-child b{font-size:12px!important}
            #builderTab .builder-row .muted{font-size:9px!important}
            #builderTab .toolbar:nth-of-type(2){display:flex!important;flex-wrap:nowrap!important;gap:6px!important}
            #builderTab .toolbar:nth-of-type(2)>*{flex:1 1 0!important;min-width:0!important;width:0!important}
          }
          @media(max-width:380px){
            #builderTab .card{padding:13px!important}
            #builderTab .builder-row{grid-template-columns:minmax(0,1fr) 45px 53px 76px!important;gap:3px!important}
            #builderTab .builder-row input,#builderTab .builder-row select{font-size:13px!important;padding-left:3px!important;padding-right:3px!important}
          }
          </style>
          <script id="ios-create-workout-label-v1">
          (function(){
            function fixReps(root){
              if(!root)return;
              var walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);
              var n;
              while(n=walker.nextNode()){
                if(n.nodeValue && n.nodeValue.trim()==='Planned') n.nodeValue='Reps';
              }
            }
            function start(){
              var b=document.getElementById('builder');
              if(!b)return;
              fixReps(b);
              new MutationObserver(function(){fixReps(b)}).observe(b,{subtree:true,childList:true,characterData:true});
            }
            if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',start);else start();
          })();
          </script>
          '''
          s = s.replace('</head>', css + '\n</head>', 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Fix Create Workout iPhone row layout and Reps label"
          git push
