name: Polish Create Workout iOS

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply idempotent iOS exercise layout polish
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          marker = '<style id="workout-exercise-line-v7">'
          css = r'''<style id="workout-exercise-line-v7">
          /* Stable iPhone layout for Exercise | Sets | Reps | Equipment. */
          #routine .card>div:first-child{display:grid!important;grid-template-columns:minmax(0,1fr) 58px 64px 92px!important;gap:6px!important;align-items:center!important;width:100%!important;min-width:0!important}
          #routine .card>div:first-child>strong{font-size:18px!important;line-height:1.2!important;overflow-wrap:anywhere!important;min-width:0!important}
          #routine .card>div:first-child>div{min-width:0!important;color:#1c1c1e!important}
          #routine .card>div:first-child>div .muted{font-size:12px!important;color:#6c6c70!important}
          #routine .card>div:first-child>select{width:100%!important;min-width:0!important;max-width:100%!important;min-height:42px!important;padding:7px 5px!important;border:1px solid #c7c7cc!important;border-radius:11px!important;background:#f9f9fb!important;color:#1c1c1e!important;font-size:14px!important}
          #routine .workout-exercise-labels{display:grid!important;grid-template-columns:minmax(0,1fr) 58px 64px 92px!important;gap:6px!important;align-items:end!important;margin-bottom:4px!important;padding:0 4px!important;color:#6c6c70!important;font-size:12px!important;font-weight:650!important}
          #routine .workout-exercise-labels span:not(:first-child){text-align:center!important}
          @media(max-width:600px),(pointer:coarse){
            #routine .card>div:first-child{grid-template-columns:minmax(0,1fr) 48px 54px 78px!important;gap:4px!important}
            #routine .card>div:first-child>strong{font-size:17px!important}
            #routine .card>div:first-child>div .muted{font-size:11px!important}
            #routine .card>div:first-child>select{min-height:40px!important;font-size:13px!important}
            #routine .workout-exercise-labels{grid-template-columns:minmax(0,1fr) 48px 54px 78px!important;gap:4px!important;font-size:11px!important}
          }
          @media(max-width:380px){
            #routine .card>div:first-child{grid-template-columns:minmax(0,1fr) 44px 50px 72px!important;gap:3px!important}
            #routine .workout-exercise-labels{grid-template-columns:minmax(0,1fr) 44px 50px 72px!important;gap:3px!important}
          }
          </style>'''

          # Remove prior generated versions so the workflow is self-cleaning.
          s = re.sub(r'<style id="workout-exercise-line-v[0-9]+">.*?</style>\s*', '', s, flags=re.S)
          if '</head>' not in s:
              raise SystemExit('index.html has no </head> marker; refusing to modify it')
          s = s.replace('</head>', css + '\n</head>', 1)

          # Only add the optional label row when the current render code is known.
          # Never fail the build because an older renderRoutine block disappeared.
          if 'workout-exercise-labels' not in s:
              current = re.compile(r'(html\+=`<div class="card"[^\n]*?)(<div[^>]*>\s*<strong>\$\{esc\(e\.exercise\)\}</strong>)', re.S)
              s2, n = current.subn(r'\1<div class="workout-exercise-labels"><span>Exercise</span><span>Sets</span><span>Reps</span><span>Equipment</span></div>\2', s, count=1)
              s = s2 if n else s

          p.write_text(s, encoding='utf-8')
          print('iOS exercise layout polish applied; renderRoutine source shape is not required.')
          PY

      - name: Commit only if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes needed."
            exit 0
          fi
          git commit -m "Harden iOS exercise layout polish"
          git push
