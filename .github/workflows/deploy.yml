name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Build plain Safari-safe app
        run: |
          python - <<'PY'
          import gzip
          with gzip.open("app-20260924.txt", "rb") as src:
              data = src.read()
          with open("index.html", "wb") as dst:
              dst.write(data)
          print("Generated index.html:", len(data), "bytes")
          PY
          test -s index.html
          grep -qi '<html' index.html
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
