name: App Integrity

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=( *.js )
          test "${#files[@]}" -gt 0
          for file in "${files[@]}"; do
            echo "Checking $file"
            node --check "$file"
          done

      - name: Validate local script references
        shell: python
        run: |
          from pathlib import Path
          import re

          root = Path('.')
          html = (root / 'index.html').read_text(encoding='utf-8')
          refs = set(re.findall(r'<script[^>]+src=[\"\']([^\"\']+)[\"\']', html))
          nav = (root / 'category-navigation.js').read_text(encoding='utf-8')
          refs.update(re.findall(r"loadScript\([^,]+,\s*['\"]\./([^?'\"]+)", nav))

          missing = []
          for ref in sorted(refs):
            if ref.startswith(('http://', 'https://', '//', 'data:')):
              continue
            clean_ref = ref.split('?', 1)[0].split('#', 1)[0]
            path = root / clean_ref.lstrip('./')
            if not path.exists():
              missing.append(clean_ref)
          if missing:
            raise SystemExit('Missing local script references: ' + ', '.join(missing))

      - name: Validate required app files
        shell: bash
        run: |
          set -euo pipefail
          for file in \
            index.html \
            category-navigation.js \
            button-safety.js \
            home-redesign.js \
            home-navigation-fix.js \
            workout-tracking-fix.js \
            cardio-history-progress.js \
            history-cardio-fix.js \
            history-drilldown-fix.js \
            finish-workout-reset.js \
            settings-panel.js; do
            test -s "$file"
          done

      - name: Check button and navigation invariants
        shell: python
        run: |
          from pathlib import Path
          import re

          nav = Path('category-navigation.js').read_text(encoding='utf-8')
          safety = Path('button-safety.js').read_text(encoding='utf-8')
          home = Path('home-redesign.js').read_text(encoding='utf-8')
          home_nav = Path('home-navigation-fix.js').read_text(encoding='utf-8')
          finish = Path('finish-workout-reset.js').read_text(encoding='utf-8')
          suppress = Path('cardio-history-suppress.js').read_text(encoding='utf-8')
          settings = Path('settings-panel.js').read_text(encoding='utf-8')

          assert 'button-safety-loader' in nav
          assert "setAttribute('type','button')" in safety
          assert 'data-nav="workout"' in home
          assert 'data-nav="history"' in home
          assert 'data-nav="settings"' in home
          assert "settings:'settings'" in home_nav or "tab==='settings'" in home_nav
          assert re.search(r'finish-workout-reset\.js\?v=3', nav)
          assert re.search(r'cardio-history-suppress\.js\?v=2', nav)

          # Finish/reset must never dispatch input/change events because the
          # tracking layer interprets those events as edits and clears saved sets.
          assert 'dispatchEvent(new Event' not in finish
          assert "state.logs=[]" in settings
          assert "localStorage.removeItem('cardio_history_v1')" in settings
          assert "localStorage.removeItem('workout_timer_v1')" in settings

          # Legacy cardio suppression is observer-driven; no perpetual timer.
          assert 'setInterval(' not in suppress
          assert 'MutationObserver' in suppress

      - name: Check loader uniqueness and cache-busts
        shell: python
        run: |
          from pathlib import Path
          import re

          nav = Path('category-navigation.js').read_text(encoding='utf-8')
          pairs = re.findall(r"loadScript\(['\"]([^'\"]+)['\"],['\"]([^'\"]+)['\"]\)", nav)
          ids = [x[0] for x in pairs]
          assert len(ids) == len(set(ids)), 'Duplicate loader IDs found'
          for loader_id, src in pairs:
            assert '?v=' in src, f'Missing cache-bust on {loader_id}'
          print(f'Validated {len(pairs)} dynamic script loaders')

      - name: Check for duplicate workflow mutators
        shell: bash
        run: |
          set -euo pipefail
          count=$(find .github/workflows -maxdepth 1 -type f -name '*.yml' | wc -l)
          echo "Workflow count: $count"
          test "$count" -le 2
