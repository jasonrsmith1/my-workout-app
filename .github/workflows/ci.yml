name: App Integrity

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=( *.js )
          test "${#files[@]}" -gt 0
          for file in "${files[@]}"; do
            echo "Checking $file"
            node --check "$file"
          done

      - name: Validate local script references
        shell: python
        run: |
          from pathlib import Path
          import re

          root = Path('.')
          html = (root / 'index.html').read_text(encoding='utf-8')
          refs = set(re.findall(r'<script[^>]+src=[\"\']([^\"\']+)[\"\']', html))
          nav = (root / 'category-navigation.js').read_text(encoding='utf-8')
          refs.update(re.findall(r"loadScript\([^,]+,\s*['\"]\./([^?'\"]+)", nav))

          missing = []
          for ref in sorted(refs):
            if ref.startswith(('http://', 'https://', '//', 'data:')):
              continue
            clean_ref = ref.split('?', 1)[0].split('#', 1)[0]
            path = root / clean_ref.lstrip('./')
            if not path.exists():
              missing.append(clean_ref)
          if missing:
            raise SystemExit('Missing local script references: ' + ', '.join(missing))

      - name: Validate required app files
        shell: bash
        run: |
          set -euo pipefail
          for file in \
            index.html \
            category-navigation.js \
            button-safety.js \
            home-redesign.js \
            workout-tracking-fix.js \
            cardio-history-progress.js \
            history-cardio-fix.js \
            history-drilldown-fix.js \
            finish-workout-reset.js \
            settings-panel.js; do
            test -s "$file"
          done

      - name: Check button/navigation invariants
        shell: python
        run: |
          from pathlib import Path
          import re

          html = Path('index.html').read_text(encoding='utf-8')
          nav = Path('category-navigation.js').read_text(encoding='utf-8')
          safety = Path('button-safety.js').read_text(encoding='utf-8')

          assert 'button-safety-loader' in nav
          assert "setAttribute('type','button')" in safety
          assert 'data-nav="workout"' in html or 'data-nav=\'workout\'' in html or 'data-nav="workout"' in Path('home-redesign.js').read_text(encoding='utf-8')
          assert 'data-nav="history"' in Path('home-redesign.js').read_text(encoding='utf-8')
          assert 'data-nav="settings"' in Path('home-redesign.js').read_text(encoding='utf-8')
          assert re.search(r'finish-workout-reset\.js\?v=3', nav)

      - name: Check for duplicate workflow mutators
        shell: bash
        run: |
          set -euo pipefail
          count=$(find .github/workflows -maxdepth 1 -type f -name '*.yml' | wc -l)
          echo "Workflow count: $count"
          test "$count" -le 2
