name: iPhone screen fit

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply iPhone layout patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          marker='/* IPHONE_SCREEN_FIT_V1 */'
          if marker not in s:
              css='''\n<style>\n/* IPHONE_SCREEN_FIT_V1 */\nhtml,body{width:100%;max-width:100%;overflow-x:hidden}\nbody{min-width:0}\n.wrap,.grid,main,.card,#routine,#premadeTab,#workoutTab{min-width:0;max-width:100%;width:100%}\n.card{overflow:hidden}\n.tabs{width:100%;min-width:0}\n.tabs .tab{flex:1 1 auto;min-width:0;white-space:normal}\n.workout-nav{width:100%;min-width:0}\n.workout-nav label{min-width:0!important;width:100%}\n.workout-nav select,.workout-nav input{min-width:0!important;max-width:100%;width:100%}\n.setrow{grid-template-columns:44px minmax(0,1fr) minmax(0,1fr)!important;min-width:0}\n.setrow>*{min-width:0;max-width:100%}\n.setrow input{min-width:0;width:100%;max-width:100%;font-size:16px}\n.setdone{grid-column:1/-1;width:100%;font-size:15px;padding:10px}\n.builder-row{grid-template-columns:minmax(0,1fr) 62px 78px 96px!important}\n.builder-row>*{min-width:0}\n.exercise-item{min-width:0;overflow:hidden}\n.exercise-item>*{min-width:0}\n#exerciseLibrary{min-width:0;max-width:100%;overflow:hidden}\n#freeBuildBarDirect{max-width:100%;overflow:hidden}\n@media (pointer:coarse) and (max-width:1000px){\n  .top{position:relative;padding:12px 14px}\n  .top h1{font-size:20px}\n  .wrap{padding:8px!important}\n  .grid{display:block!important}\n  aside{display:none!important}\n  .tabs{gap:6px;margin-bottom:8px}\n  .tabs .tab{padding:10px 8px;font-size:15px}\n  .card{padding:12px;border-radius:12px}\n  .toolbar{gap:7px}\n  .toolbar label{width:100%!important}\n  .metricgrid{grid-template-columns:repeat(2,minmax(0,1fr))}\n}\n@media (pointer:coarse) and (max-width:430px){\n  .top h1{font-size:18px}\n  .tabs .tab{font-size:14px;padding:9px 6px}\n  .setrow{grid-template-columns:42px minmax(0,1fr) minmax(0,1fr)!important}\n  .setrow input{padding:9px 7px}\n}\n</style>\n'''
              s=s.replace('</head>',css+'</head>',1)
              p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git diff --cached --quiet || git commit -m "Fix iPhone layout overflow"
          git push
