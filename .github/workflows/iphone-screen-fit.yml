name: iPhone screen fit

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply iPhone layout patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text()

          # Fix the actual workout summary markup at its source. Do not rely on
          # service-worker DOM overlays: the app renders this HTML dynamically.
          marker='workout-summary-source-v1'
          if marker not in s:
              pattern = re.compile(r'''html\+=`<div class="card" style="padding:11px;margin:8px 0"><div class="workout-exercise-labels">.*?</select></div>\n      <div class="setrows">''', re.S)
              replacement = '''html+=`<div class="card" style="padding:11px;margin:8px 0"><div class="workout-summary-source-v1"><div class="workout-summary-exercise"><strong>${esc(e.exercise)}</strong></div><div class="workout-summary-inline"><span class="workout-summary-pair"><span class="muted">Sets</span> <strong>${esc(e.sets||'1')}</strong></span><span class="workout-summary-pair"><span class="muted">Reps</span> <strong>${esc(e.reps)}</strong></span><span class="workout-summary-pair workout-summary-equipment"><span class="muted">Equipment</span> <select id="eq_${id}"><option>Barbell</option><option>Dumbbells</option><option>Bodyweight</option><option>Cable/Machine</option><option>Kettlebell</option><option>Other</option></select></span></div></div>\n      <div class="setrows">'''
              s2, n = pattern.subn(replacement, s, count=1)
              if n != 1:
                  raise SystemExit(f'Workout summary source pattern not found; matches={n}')
              s=s2

              css='''\n<style id="workout-summary-source-v1-css">\n.workout-summary-source-v1{width:100%;min-width:0}\n.workout-summary-exercise{width:100%;margin-bottom:7px}\n.workout-summary-exercise strong{display:block;color:#1c1c1e;font-size:17px;line-height:1.2;overflow-wrap:anywhere}\n.workout-summary-inline{display:flex;align-items:center;gap:14px;width:100%;min-width:0;overflow:hidden}\n.workout-summary-pair{display:inline-flex;align-items:center;gap:4px;white-space:nowrap;min-width:0}\n.workout-summary-pair .muted{color:#6c6c70!important;font-size:12px!important;font-weight:600!important}\n.workout-summary-pair strong{color:#1c1c1e!important;font-size:16px!important}\n.workout-summary-equipment{flex:1 1 auto;min-width:0}\n.workout-summary-equipment select{width:auto;min-width:0;max-width:100%;min-height:38px;padding:6px 8px;border:1px solid #c7c7cc;border-radius:10px;background:#f2f2f7;color:#1c1c1e;font-size:14px}\n@media(max-width:560px){\n  .workout-summary-inline{gap:9px}\n  .workout-summary-pair{gap:3px}\n  .workout-summary-pair .muted{font-size:11px!important}\n  .workout-summary-pair strong{font-size:15px!important}\n  .workout-summary-equipment select{font-size:13px;min-height:38px;padding:6px 5px}\n}\n</style>\n'''
              s=s.replace('</head>',css+'</head>',1)
              p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git diff --cached --quiet || git commit -m "Fix workout summary markup directly"
          git push
